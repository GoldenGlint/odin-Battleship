<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="initial-screen">
        <dialog id="initial-screen">
            <h1>Enter Player Information</h1>

            <label for="player-one-name">Player One</label>
            <input type="text" id="player-one-name" placeholder="Player One">

            <select id="player-one-type">
                <option value="HUMAN">HUMAN</option>
                <option value="CPU">CPU</option>
             </select>

            <label for="player-two-name">Player Two</label>
            <input type="text" id="player-two-name" placeholder="Player Two">

            <select id="player-two-type">
                <option value="HUMAN">HUMAN</option>
                <option value="CPU">CPU</option>
            </select>
            <button id="start-game">Start Game</button>
        </dialog>
    </div>

    <div class="title">
        <h1>BattleShip</h1>
    </div>
    <div id="boards">
        <div class="playerContainer">
            <div class="header" id="p1Header">
               
            </div>
            <div id="p1Grid" class="grid">

            </div>
        </div>
        <div class="playerContainer">
            <div class="header" id="p2Header">
                
            </div>
            <div id="p2Grid" class="grid">

            </div>
            
        </div>
    </div>
    
    
</body>
</html>
